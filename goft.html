<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>فرم واقعه — نسخه هفت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --paper:#f6efe2;
  --ink:#2a241c;
  --line:#c9b89a;
  --gold:#7a5c2e;
  --screen:#1b1712;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--screen);color:var(--paper);font:16px/1.85 Vazirmatn,Tahoma,sans-serif}
html.hdr-off .toolbar .hidable{display:none}
.toolbar{position:sticky;top:0;z-index:20;background:#14110d;border-bottom:1px solid #3a3328;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar a,.toolbar button{font:700 14px Vazirmatn,sans-serif;background:#2a241c;color:var(--paper);border:1px solid #5a4e3c;border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer;text-decoration:none}
.wrap{max-width:880px;margin:0 auto;padding:18px 14px 80px}
h1{font-size:1.25rem;margin:0 0 8px;color:#e8d7b0}
.sub,.hint{color:#cbbda6;margin:0 0 16px}
.sheet{
  background:var(--paper);
  color:var(--ink);
  border:1px solid #d8c7a8;
  border-radius:6px;
  padding:22px 20px 28px;
  margin:0 0 28px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}
.sheet h2{margin:0 0 6px;font-size:1.15rem;color:var(--gold);border-bottom:2px solid var(--gold);padding-bottom:6px}
.headrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.headrow input{flex:1}
label{display:block;font-weight:800;font-size:.82rem;color:var(--gold);margin:10px 0 4px}
input,textarea{
  width:100%;
  border:0;
  border-bottom:1px dashed var(--line);
  background:transparent;
  color:var(--ink);
  font:16px/1.8 Vazirmatn,Tahoma,sans-serif;
  padding:6px 2px;
  resize:vertical;
}
textarea{border:1px dashed var(--line);border-radius:4px;padding:8px;background:rgba(255,255,255,.35);min-height:72px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.del{background:transparent;border:1px solid var(--line);color:#7a3b2e;border-radius:8px;padding:6px 10px;font:700 13px Vazirmatn,sans-serif;cursor:pointer}
.voice{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.voice button{font:700 13px Vazirmatn,sans-serif;background:#2a241c;color:#f6efe2;border:1px solid #5a4e3c;border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
.voice button.on{background:#5a2a24;border-color:#c45c4a}
.mic{font-size:.85rem;color:#7a5c2e;margin:0 0 8px;min-height:1.4em}
.paste{min-height:90px}
#wk-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14352e;color:#86e0a3;border:1px solid #86e0a3;padding:10px 18px;border-radius:12px;z-index:80;font:600 15px Vazirmatn,sans-serif;display:none;max-width:90%}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
@media print{
  body{background:#fff}
  .toolbar,.hint,.voice,.mic,#wk-toast{display:none!important}
  .wrap{max-width:none;padding:0}
  .sheet{box-shadow:none;border:1px solid #b9a57e;border-radius:0;break-after:page;margin:0}
  a{display:none}
}
</style>
</head>
<body>
<div class="toolbar">
  <a href="index.html">فهرست</a>
  <a class="hidable" href="workshop-vaghee-form.html">کارگاه ستون‌ها</a>
  <button type="button" id="btnAdd">واقعهٔ خالی</button>
  <button class="hidable" type="button" id="btnSave">ذخیره</button>
  <button class="hidable" type="button" id="btnPrint">چاپ یا پی‌دی‌اف</button>
  <button class="hidable" type="button" id="btnTxt">خروجی متن</button>
  <button type="button" id="btnHdr">پنهان هدر</button>
</div>
<div class="wrap">
  <h1>فرم واقعه — نسخه هفت</h1>
  <p class="sub">جعبهٔ بزرگ را بزن. روی کیبورد، دکمهٔ میکروفن را بزن. حرف بزن. متن همان‌جا و توی ستون واقعه می‌آید. دکمهٔ بگو لازم نیست.</p>
  <p class="hint hidable">خانه‌ها: واقعه، نگاه، نقاب و نقش، الگو، دکان، ترس و مبادا، درون، سناریوها، جملهٔ ته.</p>
  <div id="list"></div>
</div>
<script src="workshop-sync.js?v=7"></script>
<script>
const LS = "form-vaghee-class-v1";
const FIELDS = [
  ["vaghee", "واقعه"],
  ["negah", "نگاه"],
  ["naqab", "نقاب و نقش"],
  ["olgo", "الگوی رفتاری"],
  ["dokon", "دکان"],
  ["tars", "ترس و مبادا"],
  ["darun", "تجربهٔ درونی"],
  ["sen", "سناریوها"],
  ["jumle", "جملهٔ آزمایشی ته"]
];
function faNum(n) {
  return String(n).replace(/[0-9]/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
}
function toast(msg) {
  let el = document.getElementById("wk-toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "wk-toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = "none"; }, 2400);
}
function blank() {
  const o = { title: "", goft: "" };
  FIELDS.forEach(([k]) => { o[k] = ""; });
  return o;
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS));
    if (s && Array.isArray(s.items) && s.items.length) return s.items;
  } catch (e) {}
  return [blank()];
}
function save(list) {
  localStorage.setItem(LS, JSON.stringify({ items: list, t: Date.now() }));
  if (window.KargahSync && KargahSync.pushSoon) KargahSync.pushSoon();
}
function el(tag, attrs, html) {
  const n = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v));
  if (html != null) n.innerHTML = html;
  return n;
}
let items = [];
let rec = null;
let recIndex = -1;
let recFinal = "";
const list = document.getElementById("list");

function paint() {
  list.innerHTML = "";
  items.forEach((it, i) => {
    const sheet = el("article", { class: "sheet", "data-i": String(i) });
    const head = el("div", { class: "headrow" });
    const t = el("input", { "data-k": "title", "data-i": String(i), placeholder: "عنوان واقعه" });
    t.value = it.title || "";
    const del = el("button", { type: "button", class: "del", "data-del": String(i) }, "حذف");
    head.appendChild(t);
    head.appendChild(del);
    sheet.appendChild(el("h2", {}, "برگهٔ " + faNum(i + 1)));
    sheet.appendChild(head);

    const voice = el("div", { class: "voice" });
    voice.appendChild(el("button", { type: "button", "data-speak": String(i) }, "بگو — تا وقتی دوباره بزنی"));
    voice.appendChild(el("button", { type: "button", "data-stop": String(i) }, "تمام — بریز تو واقعه"));
    voice.appendChild(el("button", { type: "button", "data-help": String(i) }, "پیشنهاد ستون‌ها"));
    voice.appendChild(el("button", { type: "button", "data-copy": String(i) }, "کپی برای هوش مصنوعی"));
    sheet.appendChild(voice);
    sheet.appendChild(el("p", { class: "mic", "data-mic": String(i) }, it.goft ? "رونوشت ذخیره شده" : "بگو، بنویس، یا ضبط کن؛ متن می‌رود توی ستون واقعه"));
    const goftBox = document.createElement("div");
    goftBox.appendChild(el("label", {}, "این جعبه را بزن — بعد میکروفن کیبورد گوشی"));
    const goftTa = document.createElement("textarea");
    goftTa.dataset.k = "goft";
    goftTa.dataset.i = String(i);
    goftTa.rows = 8;
    goftTa.style.minHeight = "160px";
    goftTa.setAttribute("enterkeyhint", "done");
    goftTa.setAttribute("lang", "fa");
    goftTa.placeholder = "اینجا را لمس کن. میکروفن کیبورد را بزن. حرف بزن. تمام که شد کیبورد را ببند.";
    goftTa.value = it.goft || it.vaghee || "";
    goftBox.appendChild(goftTa);
    sheet.appendChild(goftBox);

    const grid = el("div", { class: "grid" });
    FIELDS.forEach(([k, lab], idx) => {
      const box = document.createElement("div");
      if (idx === 0 || idx >= 7) box.style.gridColumn = "1 / -1";
      box.appendChild(el("label", {}, k === "vaghee" ? "واقعه یا رونوشت" : lab));
      const ta = document.createElement("textarea");
      ta.dataset.k = k;
      ta.dataset.i = String(i);
      ta.rows = k === "vaghee" || k === "sen" ? 4 : 3;
      ta.value = it[k] || "";
      box.appendChild(ta);
      grid.appendChild(box);
    });
    const extra = document.createElement("div");
    extra.style.gridColumn = "1 / -1";
    extra.appendChild(el("label", {}, "پاسخ هوش مصنوعی را اینجا بچسبان"));
    extra.appendChild(el("textarea", { class: "paste", "data-paste": String(i), rows: "3", placeholder: "اگر پیشنهاد ابری کار نکرد، پاسخ را اینجا بگذار و بیرون بزن" }));
    grid.appendChild(extra);
    sheet.appendChild(grid);
    list.appendChild(sheet);
  });
}
function readDom() {
  items.forEach((_, i) => {
    const root = list.querySelector('.sheet[data-i="' + i + '"]');
    if (!root) return;
    root.querySelectorAll("[data-k]").forEach((n) => {
      items[i][n.dataset.k] = n.value;
    });
  });
}
function aiPrompt(it) {
  return [
    "این یک واقعه است. حکم نده. فرض کارگاهی بده. ستون‌ها را با همین عنوان‌ها پر کن:",
    "واقعه (فقط دوربین)",
    "نگاه",
    "نقاب و نقش",
    "الگوی رفتاری",
    "دکان",
    "ترس و مبادا",
    "تجربهٔ درونی",
    "سناریوها",
    "جملهٔ آزمایشی ته",
    "",
    "عنوان: " + (it.title || ""),
    "متن یا رونوشت:",
    it.vaghee || it.goft || ""
  ].join("\n");
}
function applyFields(i, fields) {
  if (!fields) return;
  const map = {
    title: "title",
    vaghee: "vaghee",
    negah: "negah",
    naqab: "naqab",
    olgo: "olgo",
    dokon: "dokon",
    tars: "tars",
    darun: "darun",
    sen: "sen",
    jumle: "jumle",
    "عنوان": "title",
    "واقعه": "vaghee",
    "نگاه": "negah",
    "نقاب": "naqab",
    "نقاب و نقش": "naqab",
    "الگو": "olgo",
    "الگوی رفتاری": "olgo",
    "دکان": "dokon",
    "ترس": "tars",
    "ترس و مبادا": "tars",
    "درون": "darun",
    "تجربه درونی": "darun",
    "تجربهٔ درونی": "darun",
    "سناریوها": "sen",
    "جمله": "jumle",
    "جملهٔ آزمایشی ته": "jumle"
  };
  Object.keys(fields).forEach((k) => {
    const dest = map[k] || (map[String(k).trim()] || "");
    if (!dest) return;
    const val = String(fields[k] || "").trim();
    if (!val) return;
    if (dest === "vaghee") putVaghee(i, val, true);
    else if (!String(items[i][dest] || "").trim()) items[i][dest] = val;
  });
}
function parsePasted(text) {
  const out = {};
  const labels = [
    ["واقعه", "vaghee"],
    ["نگاه", "negah"],
    ["نقاب و نقش", "naqab"],
    ["نقاب", "naqab"],
    ["الگوی رفتاری", "olgo"],
    ["الگو", "olgo"],
    ["دکان", "dokon"],
    ["ترس و مبادا", "tars"],
    ["ترس", "tars"],
    ["تجربهٔ درونی", "darun"],
    ["درون", "darun"],
    ["سناریوها", "sen"],
    ["جملهٔ آزمایشی ته", "jumle"],
    ["جمله", "jumle"],
    ["عنوان", "title"]
  ];
  const lines = String(text || "").split(/\n+/);
  let cur = null;
  lines.forEach((ln) => {
    const t = ln.trim();
    let hit = null;
    labels.forEach(([lab, key]) => {
      if (t === lab || t.indexOf(lab + ":") === 0 || t.indexOf(lab + "：") === 0) hit = key;
    });
    if (hit) {
      cur = hit;
      const rest = t.replace(/^[^:：]+[:：]\s*/, "");
      if (rest && rest !== t) out[cur] = (out[cur] ? out[cur] + "\n" : "") + rest;
      return;
    }
    if (cur) out[cur] = (out[cur] ? out[cur] + "\n" : "") + t;
  });
  if (!Object.keys(out).length) out.vaghee = String(text || "").trim();
  return out;
}
function setMic(i, msg) {
  const eln = list.querySelector('[data-mic="' + i + '"]');
  if (eln) eln.textContent = msg;
}
let recording = false;
let listenOn = false;
let recCtx = null;
let recProc = null;
let recGain = null;
let recSrc = null;
let recStream = null;
let recPcm = [];
let recRate = 16000;
let recClock = 0;
let recStarted = 0;
let recRms = 0;
function isSafariApp() {
  const ua = navigator.userAgent || "";
  const iOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const safari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|Chrome|Chromium|Android/.test(ua);
  return iOS || safari;
}
function Speech() {
  return window.SpeechRecognition || window.webkitSpeechRecognition;
}
function putVaghee(i, text, append) {
  const add = String(text || "").trim();
  if (!add) return;
  const cur = String(items[i].vaghee || items[i].goft || "").trim();
  let t = add;
  if (append && cur) {
    if (cur.indexOf(add) !== -1) t = cur;
    else t = cur + (/\s$/.test(cur) ? "" : " ") + add;
  }
  items[i].goft = t;
  items[i].vaghee = t;
  const root = list.querySelector('.sheet[data-i="' + i + '"]');
  if (root) {
    const g = root.querySelector('textarea[data-k="goft"]');
    const v = root.querySelector('textarea[data-k="vaghee"]');
    if (g) g.value = t;
    if (v) v.value = t;
  }
  save(items);
}
function blobB64(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result || ""));
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}
function speakBtn(i) {
  return list.querySelector('[data-speak="' + i + '"]');
}
function pcmToWav(chunks, sampleRate) {
  let total = 0;
  chunks.forEach((c) => { total += c.length; });
  const merged = new Float32Array(total);
  let off = 0;
  chunks.forEach((c) => { merged.set(c, off); off += c.length; });
  const target = 16000;
  const step = sampleRate / target;
  const n = Math.max(1, Math.floor(merged.length / step));
  const pcm = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const s = Math.max(-1, Math.min(1, merged[Math.min(merged.length - 1, Math.floor(i * step))]));
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  const bytes = pcm.byteLength;
  const buf = new ArrayBuffer(44 + bytes);
  const v = new DataView(buf);
  function wstr(at, s) {
    for (let i = 0; i < s.length; i++) v.setUint8(at + i, s.charCodeAt(i));
  }
  wstr(0, "RIFF");
  v.setUint32(4, 36 + bytes, true);
  wstr(8, "WAVE");
  wstr(12, "fmt ");
  v.setUint32(16, 16, true);
  v.setUint16(20, 1, true);
  v.setUint16(22, 1, true);
  v.setUint32(24, target, true);
  v.setUint32(28, target * 2, true);
  v.setUint16(32, 2, true);
  v.setUint16(34, 16, true);
  wstr(36, "data");
  v.setUint32(40, bytes, true);
  new Uint8Array(buf, 44).set(new Uint8Array(pcm.buffer));
  return new Blob([buf], { type: "audio/wav" });
}
function stopDictation() {
  listenOn = false;
  try { if (rec) rec.stop(); } catch (e) {}
  rec = null;
}
function stopCapture() {
  clearInterval(recClock);
  stopDictation();
  try { if (recProc) recProc.disconnect(); } catch (e) {}
  try { if (recSrc) recSrc.disconnect(); } catch (e) {}
  try { if (recGain) recGain.disconnect(); } catch (e) {}
  try { if (recCtx && recCtx.state !== "closed") recCtx.close(); } catch (e) {}
  if (recStream) recStream.getTracks().forEach((t) => t.stop());
  recProc = recSrc = recGain = recCtx = recStream = null;
  recording = false;
}
function markBtn(i, on) {
  const b = speakBtn(i);
  if (!b) return;
  b.classList.toggle("on", !!on);
  b.textContent = on ? "در حال شنیدن — بزن تا تمام شود" : "بگو — تا وقتی دوباره بزنی";
}
function startDictationLoop(i) {
  const Rec = Speech();
  if (!Rec) return false;
  listenOn = true;
  recIndex = i;
  recFinal = items[i].goft || items[i].vaghee || "";
  function arm() {
    if (!listenOn || recIndex !== i) return;
    const r = new Rec();
    r.lang = "fa-IR";
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;
    r.onresult = function (ev) {
      let inter = "";
      for (let n = ev.resultIndex; n < ev.results.length; n++) {
        const tx = ev.results[n][0].transcript;
        if (ev.results[n].isFinal) recFinal += (recFinal && !/\s$/.test(recFinal) ? " " : "") + tx;
        else inter += tx;
      }
      const shown = (recFinal + (inter ? " " + inter : "")).trim();
      if (shown) putVaghee(i, shown);
      setMic(i, "متن زنده می‌آید — تمام که شد همان دکمه را بزن");
    };
    r.onerror = function (ev) {
      const err = ev && ev.error;
      if (err === "not-allowed") {
        listenOn = false;
        setMic(i, "میکروفن بسته است");
        toast("در تنظیمات سافاری میکروفن را اجازه بده");
      }
    };
    r.onend = function () {
      rec = null;
      if (listenOn && recIndex === i) setTimeout(arm, 60);
    };
    try {
      r.start();
      rec = r;
    } catch (e) {
      setTimeout(arm, 280);
    }
  }
  arm();
  return true;
}
function startTalk(i, btn) {
  if (recording && recIndex === i) {
    finishTalk(i);
    return;
  }
  if (recording) finishTalk(recIndex);
  recIndex = i;
  recording = true;
  recPcm = [];
  recStarted = Date.now();
  recFinal = items[i].goft || items[i].vaghee || "";
  markBtn(i, true);
  const dict = startDictationLoop(i);
  recClock = setInterval(function () {
    const s = Math.floor((Date.now() - recStarted) / 1000);
    const has = String(items[i].vaghee || "").trim();
    setMic(i, "شنیدن " + faNum(s) + " ثانیه" + (has ? " — متن در واقعه است" : " — حرف بزن") + " — تمام را بزن");
  }, 300);
  if (dict) {
    setMic(i, "دیکته روشن شد — فارسی بگو؛ متن همان‌جا می‌آید");
    toast("بگو. متن باید همان موقع در واقعه ظاهر شود");
  } else {
    setMic(i, "دیکته در این مرورگر نیست — در جعبه بنویس");
    toast("در سافاری دیکته نیست؛ در جعبهٔ رونوشت بنویس");
  }
  if (btn) btn.classList.add("on");
}
function finishTalk(i) {
  if (i == null) i = recIndex;
  const had = String((items[i] && (items[i].vaghee || items[i].goft)) || recFinal || "").trim();
  stopCapture();
  markBtn(i, false);
  if (had) {
    putVaghee(i, had);
    setMic(i, "متن در ستون واقعه است");
    toast("متن ذخیره شد");
    return;
  }
  setMic(i, "متنی نیامد — کیبورد فارسی را روشن کن و دوباره بگو، یا در جعبه بنویس");
  toast("متنی نیامد. کیبورد فارسی روشن باشد");
}
list.addEventListener("input", (e) => {
  readDom();
  const k = e.target && e.target.dataset && e.target.dataset.k;
  const i = e.target && e.target.dataset ? +e.target.dataset.i : -1;
  if (k === "goft" && i >= 0) {
    items[i].vaghee = e.target.value;
    const v = list.querySelector('.sheet[data-i="' + i + '"] textarea[data-k="vaghee"]');
    if (v) v.value = e.target.value;
  }
  if (k === "vaghee" && i >= 0 && !String(items[i].goft || "").trim()) {
    items[i].goft = e.target.value;
    const g = list.querySelector('.sheet[data-i="' + i + '"] textarea[data-k="goft"]');
    if (g) g.value = e.target.value;
  }
  save(items);
});
list.addEventListener("click", async (e) => {
  const del = e.target.closest("[data-del]");
  if (del) {
    readDom();
    items.splice(+del.dataset.del, 1);
    if (!items.length) items.push(blank());
    save(items);
    paint();
    return;
  }
  const speak = e.target.closest("[data-speak]");
  if (speak) {
    const i = +speak.dataset.speak;
    if (recording && recIndex === i) {
      finishTalk(i);
      return;
    }
    startTalk(i, speak);
    return;
  }
  const stop = e.target.closest("[data-stop]");
  if (stop) {
    finishTalk(+stop.dataset.stop);
    return;
  }
  const copyb = e.target.closest("[data-copy]");
  if (copyb) {
    readDom();
    const i = +copyb.dataset.copy;
    const txt = aiPrompt(items[i]);
    navigator.clipboard.writeText(txt).then(() => toast("متن برای هوش مصنوعی کپی شد"), () => prompt("کپی کن", txt));
    return;
  }
  const helpb = e.target.closest("[data-help]");
  if (helpb) {
    readDom();
    const i = +helpb.dataset.help;
    const it = items[i];
    if (!String(it.vaghee || it.goft || "").trim()) {
      toast("اول در جعبهٔ رونوشت یا واقعه بنویس");
      return;
    }
    helpb.disabled = true;
    setMic(i, "پیشنهاد ستون‌ها…");
    try {
      const r = await KargahSync.helpFill({
        title: it.title || "",
        vaghee: it.vaghee || it.goft || "",
        transcript: it.goft || it.vaghee || "",
        negah: it.negah || "",
        naqab: it.naqab || "",
        olgo: it.olgo || "",
        dokon: it.dokon || "",
        tars: it.tars || "",
        darun: it.darun || "",
        sen: it.sen || "",
        jumle: it.jumle || ""
      });
      applyFields(i, r.fields || r);
      save(items);
      paint();
      toast("ستون‌ها پیشنهاد شد — هر سطر را که نمی‌خواند خط بزن");
    } catch (err) {
      const txt = aiPrompt(it);
      navigator.clipboard.writeText(txt).then(() => toast("ابر کمکی نشد؛ متن کپی شد تا خودت به هوش مصنوعی بدهی"), () => prompt("کپی کن", txt));
    }
    helpb.disabled = false;
  }
});
list.addEventListener("focusout", (e) => {
  const p = e.target.closest("[data-paste]");
  if (!p) return;
  const txt = p.value.trim();
  if (!txt) return;
  const i = +p.dataset.paste;
  applyFields(i, parsePasted(txt));
  p.value = "";
  save(items);
  paint();
  toast("از متن چسبانده‌شده پر شد");
});
document.getElementById("btnAdd").onclick = () => {
  readDom();
  items.push(blank());
  save(items);
  paint();
  window.scrollTo(0, document.body.scrollHeight);
};
document.getElementById("btnSave").onclick = () => { readDom(); save(items); toast("ذخیره شد"); };
document.getElementById("btnPrint").onclick = () => { readDom(); save(items); window.print(); };
document.getElementById("btnTxt").onclick = () => {
  readDom();
  save(items);
  let out = "فرم واقعه\n" + new Date().toLocaleString("fa-IR") + "\n\n";
  items.forEach((it, i) => {
    out += "—— " + (it.title || ("واقعه " + (i + 1))) + " ——\n";
    if (it.goft) out += "رونوشت:\n" + it.goft + "\n\n";
    FIELDS.forEach(([k, lab]) => { out += lab + ":\n" + (it[k] || "—") + "\n\n"; });
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], { type: "text/plain;charset=utf-8" }));
  a.download = "form-vaghee.txt";
  a.click();
};

function applyHdr(off) {
  document.documentElement.classList.toggle("hdr-off", !!off);
  try { localStorage.setItem("kargah-hdr-off", off ? "1" : "0"); } catch (e) {}
  const b = document.getElementById("btnHdr");
  if (b) b.textContent = off ? "نمایش هدر" : "پنهان هدر";
}
document.getElementById("btnHdr").onclick = () => {
  applyHdr(!document.documentElement.classList.contains("hdr-off"));
};
async function start() {
  try { if (window.KargahSync) await KargahSync.boot(); } catch (e) {}
  items = load();
  paint();
  try { applyHdr(localStorage.getItem("kargah-hdr-off") === "1"); } catch (e) {}
}
start();
</script>
</body>
</html>
