<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-store"/>
<title>فرم واقعه — ضبط زنده</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
:root{--paper:#f6efe2;--ink:#2a241c;--line:#c9b89a;--gold:#7a5c2e;--screen:#1b1712;--red:#9b2c2c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--screen);color:var(--paper);font:16px/1.85 Vazirmatn,Tahoma,sans-serif}
.toolbar{position:sticky;top:0;z-index:20;background:#14110d;border-bottom:1px solid #3a3328;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar a,.toolbar button{font:700 14px Vazirmatn,sans-serif;background:#2a241c;color:var(--paper);border:1px solid #5a4e3c;border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer;text-decoration:none}
.wrap{max-width:880px;margin:0 auto;padding:16px 14px 100px}
h1{font-size:1.2rem;margin:0 0 8px;color:#e8d7b0}
.sub{color:#cbbda6;margin:0 0 16px}
.sheet{background:var(--paper);color:var(--ink);border:1px solid #d8c7a8;border-radius:14px;padding:16px;margin:0 0 22px}
.sheet h2{margin:0 0 10px;font-size:1.05rem;color:var(--gold)}
.headrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.headrow input{flex:1}
label{display:block;font-weight:800;font-size:.82rem;color:var(--gold);margin:10px 0 4px}
input,textarea{width:100%;border:1px dashed var(--line);border-radius:10px;background:rgba(255,255,255,.45);color:var(--ink);font:16px/1.8 Vazirmatn,Tahoma,sans-serif;padding:10px}
textarea{resize:vertical;min-height:72px}
#liveBox{min-height:180px;font-size:18px;background:#fff;border:2px solid var(--gold)}
.recbar{display:flex;gap:10px;align-items:center;margin:8px 0 12px}
.recbtn{flex:0 0 auto;width:84px;height:84px;border-radius:50%;border:0;background:var(--red);color:#fff;font:800 16px Vazirmatn,sans-serif;cursor:pointer;box-shadow:0 6px 18px rgba(155,44,44,.35)}
.recbtn.on{animation:pulse 1.2s infinite;background:#c0392b}
@keyframes pulse{50%{transform:scale(1.06)}}
.recmeta{flex:1}
.mic{margin:0;color:var(--gold);font-weight:800;min-height:1.5em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.del{background:transparent;border:1px solid var(--line);color:#7a3b2e;border-radius:8px;padding:6px 10px;font:700 13px Vazirmatn,sans-serif;cursor:pointer}
.help{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
.help button{font:700 13px Vazirmatn,sans-serif;background:#2a241c;color:#f6efe2;border:1px solid #5a4e3c;border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
#wk-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#14352e;color:#86e0a3;border:1px solid #86e0a3;padding:10px 18px;border-radius:12px;z-index:80;font:600 15px Vazirmatn,sans-serif;display:none;max-width:90%}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
@media print{.toolbar,.recbar,.help,.mic{display:none!important}}
</style>
</head>
<body>
<div class="toolbar">
  <a href="index.html">فهرست</a>
  <button type="button" id="btnAdd">واقعهٔ تازه</button>
  <button type="button" id="btnSave">ذخیره</button>
  <button type="button" id="btnPrint">چاپ</button>
</div>
<div class="wrap">
  <h1>فرم واقعه — ضبط زنده</h1>
  <p class="sub">دکمهٔ سرخ ضبط را بزن و حرف بزن. متن باید همان لحظه داخل ستون واقعه ظاهر شود. کیبورد لازم نیست. دوباره بزن تا بایستد.</p>
  <div id="list"></div>
</div>
<script src="workshop-sync.js?v=9"></script>
<script>
const LS = "form-vaghee-class-v1";
const FIELDS = [
  ["negah", "نگاه"],
  ["naqab", "نقاب و نقش"],
  ["olgo", "الگوی رفتاری"],
  ["dokon", "دکان"],
  ["tars", "ترس و مبادا"],
  ["darun", "تجربهٔ درونی"],
  ["sen", "سناریوها"],
  ["jumle", "جملهٔ آزمایشی ته"]
];
function faNum(n) {
  return String(n).replace(/[0-9]/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
}
function toast(msg) {
  let el = document.getElementById("wk-toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "wk-toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = "none"; }, 2200);
}
function blank() {
  const o = { title: "", goft: "", vaghee: "" };
  FIELDS.forEach(([k]) => { o[k] = ""; });
  return o;
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS));
    if (s && Array.isArray(s.items) && s.items.length) return s.items;
  } catch (e) {}
  return [blank()];
}
function save(list) {
  localStorage.setItem(LS, JSON.stringify({ items: list, t: Date.now() }));
  if (window.KargahSync && KargahSync.pushSoon) KargahSync.pushSoon();
}
function el(tag, attrs, html) {
  const n = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v));
  if (html != null) n.innerHTML = html;
  return n;
}
let items = [];
const list = document.getElementById("list");
let recIndex = -1;
let recording = false;
let recCtx = null;
let recProc = null;
let recGain = null;
let recSrc = null;
let recStream = null;
let recPcm = [];
let recRate = 16000;
let recClock = 0;
let recChunk = 0;
let recStarted = 0;
let recBusy = false;
let rec = null;
let listenOn = false;
let recFinal = "";

function paint() {
  const keep = recIndex;
  const was = recording;
  list.innerHTML = "";
  items.forEach((it, i) => {
    const sheet = el("article", { class: "sheet", "data-i": String(i) });
    const head = el("div", { class: "headrow" });
    const t = el("input", { "data-k": "title", "data-i": String(i), placeholder: "عنوان اختیاری" });
    t.value = it.title || "";
    head.appendChild(t);
    head.appendChild(el("button", { type: "button", class: "del", "data-del": String(i) }, "حذف"));
    sheet.appendChild(el("h2", {}, "برگهٔ " + faNum(i + 1)));
    sheet.appendChild(head);

    const recbar = el("div", { class: "recbar" });
    const btn = el("button", { type: "button", class: "recbtn", "data-rec": String(i) }, "ضبط");
    const meta = el("div", { class: "recmeta" });
    meta.appendChild(el("p", { class: "mic", "data-mic": String(i) }, "ضبط را بزن و حرف بزن"));
    recbar.appendChild(btn);
    recbar.appendChild(meta);
    sheet.appendChild(recbar);

    sheet.appendChild(el("label", {}, "واقعه — متن زنده"));
    const live = el("textarea", { id: i === 0 ? "liveBox" : "", "data-k": "vaghee", "data-i": String(i) });
    if (i === 0) live.id = "liveBox";
    live.rows = 8;
    live.placeholder = "اینجا باید همان لحظه که حرف می‌زنی پر شود";
    live.value = it.vaghee || it.goft || "";
    sheet.appendChild(live);

    const grid = el("div", { class: "grid" });
    FIELDS.forEach(([k, lab], idx) => {
      const box = document.createElement("div");
      if (idx >= 6) box.style.gridColumn = "1 / -1";
      box.appendChild(el("label", {}, lab));
      const ta = document.createElement("textarea");
      ta.dataset.k = k;
      ta.dataset.i = String(i);
      ta.rows = k === "sen" ? 3 : 2;
      ta.value = it[k] || "";
      box.appendChild(ta);
      grid.appendChild(box);
    });
    sheet.appendChild(grid);
    const help = el("div", { class: "help" });
    help.appendChild(el("button", { type: "button", "data-help": String(i) }, "پیشنهاد بقیهٔ ستون‌ها"));
    sheet.appendChild(help);
    list.appendChild(sheet);
  });
  if (was && keep >= 0) {
    const b = list.querySelector('[data-rec="' + keep + '"]');
    if (b) {
      b.classList.add("on");
      b.textContent = "بایست";
    }
  }
}
function readDom() {
  items.forEach((_, i) => {
    const root = list.querySelector('.sheet[data-i="' + i + '"]');
    if (!root) return;
    root.querySelectorAll("[data-k]").forEach((n) => {
      items[i][n.dataset.k] = n.value;
    });
    items[i].goft = items[i].vaghee || "";
  });
}
function setMic(i, msg) {
  const n = list.querySelector('[data-mic="' + i + '"]');
  if (n) n.textContent = msg;
}
function putVaghee(i, text, append) {
  const add = String(text || "").trim();
  if (!add) return;
  const cur = String(items[i].vaghee || "").trim();
  let t = add;
  if (append && cur) {
    if (cur.indexOf(add) !== -1) t = cur;
    else t = cur + (/\s$/.test(cur) ? "" : " ") + add;
  }
  items[i].vaghee = t;
  items[i].goft = t;
  const v = list.querySelector('.sheet[data-i="' + i + '"] textarea[data-k="vaghee"]');
  if (v) v.value = t;
  save(items);
}
function blobB64(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result || ""));
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}
function pcmToWav(chunks, sampleRate) {
  let total = 0;
  chunks.forEach((c) => { total += c.length; });
  const merged = new Float32Array(total);
  let off = 0;
  chunks.forEach((c) => { merged.set(c, off); off += c.length; });
  const target = 16000;
  const step = sampleRate / target;
  const n = Math.max(1, Math.floor(merged.length / step));
  const pcm = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const s = Math.max(-1, Math.min(1, merged[Math.min(merged.length - 1, Math.floor(i * step))]));
    pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  const bytes = pcm.byteLength;
  const buf = new ArrayBuffer(44 + bytes);
  const v = new DataView(buf);
  function wstr(at, s) {
    for (let i = 0; i < s.length; i++) v.setUint8(at + i, s.charCodeAt(i));
  }
  wstr(0, "RIFF");
  v.setUint32(4, 36 + bytes, true);
  wstr(8, "WAVE");
  wstr(12, "fmt ");
  v.setUint32(16, 16, true);
  v.setUint16(20, 1, true);
  v.setUint16(22, 1, true);
  v.setUint32(24, target, true);
  v.setUint32(28, target * 2, true);
  v.setUint16(32, 2, true);
  v.setUint16(34, 16, true);
  wstr(36, "data");
  v.setUint32(40, bytes, true);
  new Uint8Array(buf, 44).set(new Uint8Array(pcm.buffer));
  return new Blob([buf], { type: "audio/wav" });
}
function Speech() {
  return window.SpeechRecognition || window.webkitSpeechRecognition;
}
function startDictation(i) {
  const Rec = Speech();
  if (!Rec) return;
  listenOn = true;
  recFinal = items[i].vaghee || "";
  function arm() {
    if (!listenOn || recIndex !== i) return;
    const r = new Rec();
    r.lang = "fa-IR";
    r.continuous = true;
    r.interimResults = true;
    r.onresult = function (ev) {
      let inter = "";
      for (let n = ev.resultIndex; n < ev.results.length; n++) {
        const tx = ev.results[n][0].transcript;
        if (ev.results[n].isFinal) recFinal += (recFinal && !/\s$/.test(recFinal) ? " " : "") + tx;
        else inter += tx;
      }
      const shown = (recFinal + (inter ? " " + inter : "")).trim();
      if (shown) putVaghee(i, shown);
    };
    r.onerror = function () {};
    r.onend = function () {
      rec = null;
      if (listenOn && recIndex === i) setTimeout(arm, 80);
    };
    try { r.start(); rec = r; } catch (e) { setTimeout(arm, 300); }
  }
  arm();
}
async function flushChunk(i, last) {
  if (recBusy) return;
  const keep = last ? 0 : Math.max(1, Math.ceil((recRate * 0.3) / 4096));
  const chunks = recPcm.slice();
  if (!chunks.length) return;
  recPcm = keep ? recPcm.slice(-keep) : [];
  const wav = pcmToWav(chunks, recRate);
  if (wav.size < 1200) return;
  recBusy = true;
  setMic(i, "دارم همین الان می‌نویسم…");
  try {
    const r = await KargahSync.transcribe(await blobB64(wav), "audio/wav");
    const tx = (r && r.text) || "";
    if (tx) {
      putVaghee(i, tx, true);
      setMic(i, "در واقعه نوشته شد — ادامه بده");
    }
  } catch (e) {}
  recBusy = false;
}
function stopCapture() {
  listenOn = false;
  clearInterval(recClock);
  clearInterval(recChunk);
  try { if (rec) rec.stop(); } catch (e) {}
  rec = null;
  try { if (recProc) recProc.disconnect(); } catch (e) {}
  try { if (recSrc) recSrc.disconnect(); } catch (e) {}
  try { if (recGain) recGain.disconnect(); } catch (e) {}
  try { if (recCtx && recCtx.state !== "closed") recCtx.close(); } catch (e) {}
  if (recStream) recStream.getTracks().forEach((t) => t.stop());
  recProc = recSrc = recGain = recCtx = recStream = null;
  recording = false;
}
function markRec(i, on) {
  const b = list.querySelector('[data-rec="' + i + '"]');
  if (!b) return;
  b.classList.toggle("on", !!on);
  b.textContent = on ? "بایست" : "ضبط";
}
async function startRec(i) {
  if (recording && recIndex === i) {
    await stopRec(i);
    return;
  }
  if (recording) await stopRec(recIndex);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast("میکروفن این مرورگر بسته است");
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true } });
  } catch (e) {
    toast("اجازهٔ میکروفن را بده");
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  recCtx = new AC();
  if (recCtx.state === "suspended") await recCtx.resume();
  recRate = recCtx.sampleRate || 44100;
  recStream = stream;
  recSrc = recCtx.createMediaStreamSource(stream);
  recProc = recCtx.createScriptProcessor(4096, 1, 1);
  recGain = recCtx.createGain();
  recGain.gain.value = 0;
  recPcm = [];
  recProc.onaudioprocess = function (ev) {
    if (!recording) return;
    recPcm.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
  };
  recSrc.connect(recProc);
  recProc.connect(recGain);
  recGain.connect(recCtx.destination);
  recording = true;
  recIndex = i;
  recStarted = Date.now();
  markRec(i, true);
  startDictation(i);
  recClock = setInterval(function () {
    const s = Math.floor((Date.now() - recStarted) / 1000);
    const has = String(items[i].vaghee || "").trim();
    setMic(i, "ضبط " + faNum(s) + " ثانیه" + (has ? " — متن در واقعه است" : " — چند ثانیه صبر کن تا بنویسد"));
  }, 400);
  recChunk = setInterval(function () { flushChunk(i, false); }, 4000);
  setMic(i, "ضبط روشن است. حرف بزن");
  toast("ضبط روشن شد");
}
async function stopRec(i) {
  const leftover = recPcm.slice();
  const rate = recRate;
  stopCapture();
  markRec(i, false);
  if (leftover.length) {
    recPcm = leftover;
    recRate = rate;
    await flushChunk(i, true);
    recPcm = [];
  }
  const has = String(items[i].vaghee || "").trim();
  setMic(i, has ? "متن در ستون واقعه است" : "متنی نیامد — دوباره ضبط کن یا بنویس");
  toast(has ? "متن ذخیره شد" : "متنی نیامد");
}

list.addEventListener("input", function () { readDom(); save(items); });
list.addEventListener("click", async function (e) {
  const del = e.target.closest("[data-del]");
  if (del) {
    readDom();
    items.splice(+del.dataset.del, 1);
    if (!items.length) items.push(blank());
    save(items);
    paint();
    return;
  }
  const recb = e.target.closest("[data-rec]");
  if (recb) {
    await startRec(+recb.dataset.rec);
    return;
  }
  const helpb = e.target.closest("[data-help]");
  if (helpb) {
    readDom();
    const i = +helpb.dataset.help;
    const it = items[i];
    if (!String(it.vaghee || "").trim()) {
      toast("اول ضبط کن یا واقعه را بنویس");
      return;
    }
    helpb.disabled = true;
    try {
      const r = await KargahSync.helpFill({
        title: it.title || "",
        vaghee: it.vaghee || "",
        transcript: it.vaghee || ""
      });
      const f = r.fields || r;
      ["negah", "naqab", "olgo", "dokon", "tars", "darun", "sen", "jumle"].forEach((k) => {
        if (f[k] && !String(items[i][k] || "").trim()) items[i][k] = String(f[k]);
      });
      save(items);
      paint();
      toast("ستون‌ها پر شد");
    } catch (err) {
      toast("پیشنهاد نیامد — متن واقعه را کپی کن");
    }
    helpb.disabled = false;
  }
});
document.getElementById("btnAdd").onclick = function () {
  readDom();
  items.push(blank());
  save(items);
  paint();
};
document.getElementById("btnSave").onclick = function () { readDom(); save(items); toast("ذخیره شد"); };
document.getElementById("btnPrint").onclick = function () { readDom(); save(items); window.print(); };

async function start() {
  try { if (window.KargahSync) await KargahSync.boot(); } catch (e) {}
  items = load();
  paint();
}
start();
</script>
</body>
</html>
